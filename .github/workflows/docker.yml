name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:

  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/senthamizhvelan04/question-paper-generator:latest
            ghcr.io/senthamizhvelan04/question-paper-generator:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            set -e

            IMAGE="ghcr.io/senthamizhvelan04/question-paper-generator:latest"
            CONTAINER_NAME="examprep"

            echo "Logging into GHCR..."

            echo "${{ secrets.GHCR_TOKEN }}" | sudo docker login ghcr.io \
              -u "${{ secrets.GHCR_USERNAME }}" \
              --password-stdin

            echo "Pulling latest image..."

            sudo docker pull "$IMAGE"

            echo "Stopping old container..."

            sudo docker stop "$CONTAINER_NAME" || true

            echo "Removing old container..."

            sudo docker rm "$CONTAINER_NAME" || true

            echo "Starting new container..."

            sudo docker run -d \
              --name "$CONTAINER_NAME" \
              --restart unless-stopped \
              -p 80:80 \
              "$IMAGE"

            echo "Waiting for container..."

            sleep 10

            echo "Checking container..."

            sudo docker ps

            echo "Deployment completed successfully!"